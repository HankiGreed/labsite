media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  rename: safe

content:
  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Lab name
        type: string
        required: true
      - name: shortName
        label: Short name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: about
        label: About paragraphs
        type: text
        list: true
        required: true
      - name: university
        label: University
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: department
        label: Department
        type: string
        required: false
      - name: email
        label: Email
        type: string
        required: false
      - name: phone
        label: Phone
        type: string
        required: false
      - name: address
        label: Address lines
        type: string
        list: true
        required: true
      - name: joinText
        label: Join text
        type: text
        required: true
      - name: socials
        label: Social links
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
    operations:
      delete: false

  - name: research
    label: Research
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        required: true
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: image
        label: Image
        type: image
        required: false
      - name: body
        label: Body
        type: rich-text
        required: true
    operations:
      create: true
      rename: true
      delete: true
  - name: pathogens
    label: Pathogens
    type: collection
    path: src/content/pathogens
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: order
      order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: group
        label: Group
        type: select
        required: true
        options:
          values:
            - respiratory
            - antimicrobial-resistant
            - hypervirulent
            - endodontic-other
            - fungal
      - name: summary
        label: Summary
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        required: true
    operations:
      create: true
      rename: true
      delete: true

  - name: projects
    label: Projects
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: funder
        label: Funder
        type: string
        required: false
      - name: period
        label: Period
        type: string
        required: false
      - name: role
        label: Role
        type: string
        required: false
      - name: order
        label: Display order
        type: number
        required: true
      - name: body
        label: Project description
        type: rich-text
        required: false
    operations:
      create: true
      rename: true
      delete: true

  - name: people
    label: People
    type: collection
    path: src/content/people
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: order
      order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: group
        label: Group
        type: select
        required: true
        options:
          values:
            - leadership
            - researchers
            - students
            - alumni
      - name: order
        label: Display order
        type: number
        required: true
      - name: photo
        label: Photo
        type: image
        required: false
      - name: email
        label: Email
        type: string
        required: false
      - name: website
        label: Website
        type: string
        required: false
      - name: body
        label: Bio
        type: rich-text
        required: true
    operations:
      create: true
      rename: true
      delete: true

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: authors
        label: Authors
        type: string
        list: true
        required: true
      - name: journal
        label: Journal
        type: string
        required: true
      - name: year
        label: Year
        type: number
        required: true
      - name: doi
        label: DOI
        type: string
        required: false
      - name: url
        label: URL
        type: string
        required: false
      - name: featured
        label: Featured
        type: boolean
        required: true
    operations:
      create: true
      rename: true
      delete: true
  - name: achievements
    label: Achievements
    type: collection
    path: src/content/achievements
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: false
      - name: summary
        label: Summary
        type: text
        required: true
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: body
        label: Details
        type: rich-text
        required: false
    operations:
      create: true
      rename: true
      delete: true

  - name: news
    label: News
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: image
        label: Image
        type: image
        required: false
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: body
        label: Body
        type: rich-text
        required: true
    operations:
      create: true
      rename: true
      delete: true
