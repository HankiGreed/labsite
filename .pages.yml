media:
  input: public/images/uploads
  output: /images/uploads
  categories: [image]
  rename: safe

content:
  - name: settings
    label: Site settings
    type: file
    path: src/data/site.json
    format: json
    fields:
      - name: name
        label: Lab name
        type: string
        required: true
      - name: shortName
        label: Short name
        type: string
        required: true
      - name: tagline
        label: Tagline
        type: string
        required: true
      - name: description
        label: Description
        type: text
        required: true
      - name: about
        label: About paragraphs
        type: text
        list: true
        required: true
      - name: university
        label: University
        type: string
        required: true
      - name: location
        label: Location
        type: string
        required: true
      - name: department
        label: Department
        type: string
        required: false
      - name: email
        label: Email
        type: string
        required: false
      - name: phone
        label: Phone
        type: string
        required: false
      - name: address
        label: Address lines
        type: string
        list: true
        required: true
      - name: joinText
        label: Join text
        type: text
        required: true
      - name: socials
        label: Social links
        type: object
        list: true
        required: false
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: url
            label: URL
            type: string
            required: true
    operations:
      delete: false

  - name: homepage
    label: Homepage
    type: file
    path: src/data/home.json
    format: json
    fields:
      - name: overviewTitle
        label: Overview heading
        type: string
        required: true
      - name: overviewLabel
        label: Overview label
        type: string
        required: true
      - name: images
        label: Overview images (displayed in order)
        type: object
        list: true
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description for accessibility
            type: string
            required: true
          - name: caption
            label: Caption
            type: string
            required: false
          - name: width
            label: Image width in pixels
            type: number
            required: false
          - name: height
            label: Image height in pixels
            type: number
            required: false
      - name: researchTitle
        label: Research heading
        type: string
        required: true
      - name: researchLinkLabel
        label: Research link label
        type: string
        required: true
      - name: teamLinkLabel
        label: Team link label
        type: string
        required: true
      - name: contactTitle
        label: Contact heading
        type: string
        required: true
      - name: contactLinkLabel
        label: Contact link label
        type: string
        required: true
    operations:
      delete: false

  - name: research
    label: Research
    type: collection
    path: src/content/research
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: order
        label: Display order
        type: number
        required: true
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: image
        label: Image
        type: image
        required: false
      - name: imageAlt
        label: Image description for accessibility
        type: string
        required: false
      - name: imageWidth
        label: Image width in pixels
        type: number
        required: false
      - name: imageHeight
        label: Image height in pixels
        type: number
        required: false
      - name: body
        label: Body
        type: rich-text
        required: true
    operations:
      create: true
      rename: true
      delete: true

  - name: projects
    label: Funding
    type: collection
    path: src/content/projects
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: order
      order: asc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: funder
        label: Funder
        type: string
        required: false
      - name: amount
        label: Funding amount (include currency, leave blank if unknown)
        type: string
        required: false
      - name: period
        label: Period
        type: string
        required: false
      - name: role
        label: Role
        type: string
        required: false
      - name: order
        label: Display order
        type: number
        required: true
      - name: body
        label: Project description
        type: rich-text
        required: false
    operations:
      create: true
      rename: true
      delete: true

  - name: people
    label: Team
    type: collection
    path: src/content/people
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: name
      sort: order
      order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: string
        required: true
      - name: group
        label: Group
        type: select
        required: true
        options:
          values:
            - leadership
            - researchers
            - students
            - alumni
      - name: order
        label: Display order
        type: number
        required: true
      - name: photo
        label: Photo
        type: image
        required: false
      - name: email
        label: Email
        type: string
        required: false
      - name: website
        label: Website
        type: string
        required: false
      - name: body
        label: Bio
        type: rich-text
        required: true
    operations:
      create: true
      rename: true
      delete: true

  - name: publications
    label: Publications
    type: collection
    path: src/content/publications
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: authors
        label: Authors
        type: string
        list: true
        required: true
      - name: journal
        label: Journal
        type: string
        required: false
      - name: year
        label: Year
        type: number
        required: true
      - name: order
        label: Order within year (lower first; optional)
        type: number
        required: false
      - name: doi
        label: DOI
        type: string
        required: false
      - name: url
        label: URL
        type: string
        required: false
      - name: featured
        label: Featured
        type: boolean
        required: true
    operations:
      create: true
      rename: true
      delete: true
  - name: achievements
    label: Achievements
    type: collection
    path: src/content/achievements
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: year
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Exact date (only when the full date is documented)
        type: date
        required: false
      - name: year
        label: Year (leave blank if not documented)
        type: number
        required: false
      - name: month
        label: Month number (1–12, only if documented alongside a year)
        type: number
        required: false
      - name: order
        label: Display order within year (lower numbers first)
        type: number
        required: false
      - name: summary
        label: Summary
        type: text
        required: true
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: images
        label: Photographs (displayed in order)
        type: object
        list: true
        required: false
        fields:
          - name: src
            label: Image
            type: image
            required: true
          - name: alt
            label: Image description for accessibility
            type: string
            required: true
          - name: width
            label: Original image width in pixels
            type: number
            required: true
          - name: height
            label: Original image height in pixels
            type: number
            required: true
          - name: caption
            label: Optional caption
            type: string
            required: false
      - name: body
        label: Details
        type: rich-text
        required: false
    operations:
      create: true
      rename: true
      delete: true

  - name: news
    label: News/Events
    type: collection
    path: src/content/news
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: url
        label: Optional title link (full URL)
        type: string
        required: false
      - name: date
        label: Date
        type: date
        required: true
      - name: summary
        label: Summary
        type: text
        required: true
      - name: image
        label: Image
        type: image
        required: false
      - name: featured
        label: Featured
        type: boolean
        required: true
      - name: body
        label: Body
        type: rich-text
        required: false
    operations:
      create: true
      rename: true
      delete: true

  - name: researchPage
    label: Research page text
    type: file
    path: src/data/research.json
    format: json
    fields:
      - name: themes
        label: Themes
        type: object
        fields:
          - name: empty
            label: Empty
            type: text
            required: true
      - name: links
        label: Links
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Href
            type: string
            required: true
    operations:
      delete: false

  - name: teamPage
    label: Team page text
    type: file
    path: src/data/team.json
    format: json
    fields:
      - name: page
        label: Page
        type: object
        fields:
          - name: kicker
            label: Kicker
            type: string
            required: true
          - name: barLabel
            label: Bar Label
            type: string
            required: true
          - name: title
            label: Title
            type: string
            required: true
      - name: groups
        label: Groups
        type: object
        list: true
        fields:
          - name: key
            label: Key
            type: string
            required: true
          - name: label
            label: Label
            type: string
            required: true
          - name: empty
            label: Empty
            type: text
            required: true
    operations:
      delete: false

  - name: publicationPage
    label: Publication page settings
    type: file
    path: src/data/publications.json
    format: json
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: intro
        label: Intro
        type: text
        required: true
    operations:
      delete: false

  - name: updatesPage
    label: News and Funding page text
    type: file
    path: src/data/updates.json
    format: json
    fields:
      - name: news
        label: News
        type: object
        fields:
          - name: emptyState
            label: Empty State
            type: text
            required: true
      - name: funding
        label: Funding
        type: object
        fields:
          - name: emptyState
            label: Empty State
            type: text
            required: true
    operations:
      delete: false

  - name: navigation
    label: Navigation and sitemap
    type: file
    path: src/data/navigation.json
    format: json
    fields:
      - name: primary
        label: Main navigation
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Page path
            type: string
            required: true
          - name: sitemapOrder
            label: Footer sitemap order
            type: number
            required: true
      - name: secondary
        label: Additional sitemap pages
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
            required: true
          - name: href
            label: Page path
            type: string
            required: true
          - name: sitemapOrder
            label: Footer sitemap order
            type: number
            required: true
    operations:
      delete: false
