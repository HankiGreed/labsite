name: Deploy Astro site to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Set site URL and base path
        shell: bash
        run: |
          owner="${GITHUB_REPOSITORY%%/*}"
          repository="${GITHUB_REPOSITORY#*/}"
          if [[ "${repository,,}" == "${owner,,}.github.io" ]]; then
            site_url="https://${owner}.github.io"
            base_path="/"
          else
            site_url="https://${owner}.github.io/${repository}"
            base_path="/${repository}"
          fi
          echo "SITE_URL=${site_url}" >> "$GITHUB_ENV"
          echo "BASE_PATH=${base_path}" >> "$GITHUB_ENV"

      - name: Check Astro project
        run: npm run check

      - name: Build Astro project
        run: npm run build

      - name: Publish site to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          force_orphan: true
